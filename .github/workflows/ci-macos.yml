name: CI macOS

# Compila, testa, empacota (.dmg para Apple Silicon) e INSTALA o Claude Hub num
# runner macOS arm64. O .dmg sai como artefato "ClaudeHub-macOS-arm64".
#
# Runners macOS consomem mais minutos que os de Linux; por isso o workflow só
# roda quando muda algo que entra no instalador.
on:
  push:
    paths:
      - "apps/macos/**"
      - "apps/web/**"
      - "packages/**"
      - "services/**"
      - "scripts/**"
      - "tests/real/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/web/**"
      - "packages/**"
      - "services/**"
      - "scripts/**"
      - "tests/real/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-macos.yml"
  workflow_dispatch:
    inputs:
      publicar_release:
        description: "Publicar o .dmg como pré-lançamento (GitHub Release) com link direto"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift + Xcode + instalador
    runs-on: macos-15 # Apple Silicon (arm64)
    timeout-minutes: 40
    permissions:
      contents: write # só usado no passo opcional de publicar o Release
    env:
      # Assinatura Developer ID + notarização só acontecem se estes segredos existirem
      # no repositório (ver docs/SIGNING_NOTARIZATION.md). Sem eles sai um build de teste.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Versões
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          echo "Credenciais aceitas pelo notarytool nesta versão do Xcode:"
          xcrun notarytool submit --help 2>&1 | grep -E -- '--(key|key-id|issuer|apple-id|team-id|keychain-profile)' || true

      - name: swift build
        working-directory: apps/macos
        run: swift build

      - name: swift test
        if: ${{ !cancelled() }}
        working-directory: apps/macos
        run: swift test

      - name: xcodebuild (projeto Xcode)
        if: ${{ !cancelled() }}
        run: |
          xcodebuild \
            -project apps/macos/ClaudeHub.xcodeproj \
            -scheme ClaudeHub \
            -configuration Debug \
            -derivedDataPath apps/macos/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Importar certificado Developer ID (opcional)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Preparar chave de notarização (opcional)
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true' }}
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=$APPLE_API_ISSUER_ID" >> "$GITHUB_ENV"

      # Toda a compilação acontece aqui, na nuvem: hub, CLI, PWA, runtime, app e .dmg.
      - name: Construir o instalador (.dmg, Apple Silicon)
        run: ./scripts/build-installer.sh

      # Executa a ilha de verdade: hub + app nativo, um estado de cada vez, com captura de tela.
      - name: Fumaça — ilha nativa em execução
        env:
          SMOKE_PRINT_IMAGES: "1"
        run: node tests/real/macos-smoke.mjs

      # Para o assistente detectar um Claude Code de verdade (só `claude --version`; sem login).
      - name: Instalar o Claude Code no runner
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Teste de instalação a partir do .dmg
        env:
          SMOKE_PRINT_IMAGES: "1"
        run: node tests/real/macos-install-test.mjs apps/macos/build/ClaudeHub-*-arm64.dmg

      # Por último: o aviso de bloqueio do macOS pode ficar na tela.
      - name: Gatekeeper — o que o macOS diz deste instalador quando baixado
        env:
          SMOKE_PRINT_IMAGES: "1"
        run: node tests/real/macos-gatekeeper-check.mjs apps/macos/build/ClaudeHub-*-arm64.dmg

      - name: Log do hub (se algo falhou)
        if: ${{ failure() }}
        run: tail -60 ~/.claude-hub/hub.log || true

      - name: Publicar as capturas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ilha-nativa-capturas
          path: docs/screenshots/macos
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHub-macOS-arm64
          path: |
            apps/macos/build/ClaudeHub-*-arm64.dmg
            apps/macos/build/ClaudeHub-*-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      # Link direto para o .dmg. Só quando pedido (execução manual com "publicar_release").
      - name: Publicar pré-lançamento (GitHub Release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="$(ls apps/macos/build/ClaudeHub-*-arm64.dmg)"
          VERSION="$(tr -d '[:space:]' < dist-runtime/VERSION)"
          SHA="$(cat "$DMG.sha256")"
          TAG="v$VERSION"
          if [[ "$HAS_SIGNING" == "true" && "$HAS_NOTARY" == "true" ]]; then
            ESTADO="Signed with a Developer ID and notarized by Apple."
            TITULO="Claude Hub by Kalox $VERSION"
          else
            ESTADO="**Not signed with an Apple Developer ID and not notarized.** macOS blocks the downloaded app the first time you open it; this installer does not remove or bypass that check. See docs/INSTALL_MACOS.md and docs/SIGNING_NOTARIZATION.md."
            TITULO="Claude Hub by Kalox $VERSION (unsigned, not notarized)"
          fi
          # Notas desta versão, tiradas do CHANGELOG.md (do cabeçalho até o próximo).
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          cat > "$RUNNER_TEMP/notas.md" <<NOTAS
          Installer for Macs with Apple Silicon (M1, M2, M3 and later), macOS 14 or newer.

          $ESTADO

          | | |
          |---|---|
          | File | \`$(basename "$DMG")\` |
          | Version | $VERSION |
          | SHA-256 | \`$SHA\` |
          | Commit | $GITHUB_SHA |
          | Built and tested in | [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |

          Install: docs/INSTALL_MACOS.md (graphical steps only, nothing to compile). iPhone: docs/IPHONE_SETUP.md.

          NOTAS
          sed -i '' 's/^          //' "$RUNNER_TEMP/notas.md"
          cat "$RUNNER_TEMP/changelog.md" >> "$RUNNER_TEMP/notas.md"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$DMG" "$DMG.sha256" \
            --target "$GITHUB_SHA" --latest --title "$TITULO" --notes-file "$RUNNER_TEMP/notas.md"
          echo "Link direto: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$DMG")"
